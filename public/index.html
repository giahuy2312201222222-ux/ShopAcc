<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shop Acc Game</title>
    <style>
        body { background-color: #F5F5F7; font-family: sans-serif; margin: 0; padding-bottom: 70px; }
        .header { background: #FFFFFF; padding: 15px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #E3E5EC; position: sticky; top: 0; z-index: 100; }
        .header-logo { font-weight: bold; font-size: 20px; color: #1D3FE0; }
        .header-user { font-weight: bold; color: #16834A; font-size: 14px; }
        .content { padding: 15px; max-width: 800px; margin: 0 auto; }
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
        .card { background: #FFFFFF; border-radius: 16px; overflow: hidden; box-shadow: 0 2px 8px rgba(0,0,0,0.05); }
        .card-img { width: 100%; height: 150px; background: #E3E5EC; display: flex; align-items: center; justify-content: center; color: #747A86; font-size: 12px; }
        .card-body { padding: 12px; }
        .card-title { font-weight: bold; color: #22252B; margin-bottom: 8px; font-size: 14px; }
        .card-price { color: #D92D20; font-weight: bold; margin-bottom: 12px; font-size: 16px; }
        .btn-buy { background: #1D3FE0; color: white; border: none; padding: 10px; width: 100%; border-radius: 10px; font-weight: bold; cursor: pointer; }
        .btn-buy:disabled { background: #747A86; }
        .bottom-nav { position: fixed; bottom: 0; left: 0; right: 0; background: #FFFFFF; display: flex; justify-content: space-around; padding: 10px 0; border-top: 1px solid #E3E5EC; padding-bottom: env(safe-area-inset-bottom); }
        .nav-item { text-align: center; font-size: 12px; color: #747A86; }
        .nav-item.active { color: #1D3FE0; font-weight: bold; }
        .btn-deposit { background: #16834A; color: white; padding: 10px 20px; border-radius: 10px; border: none; margin-bottom: 20px; font-weight: bold; width: 100%; cursor: pointer;}
        
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); z-index: 999; justify-content: center; align-items: center; }
        .modal-content { background: white; padding: 24px; border-radius: 16px; width: 85%; max-width: 400px; box-shadow: 0 4px 20px rgba(0,0,0,0.15); }
        .modal h3 { text-align: center; color: #22252B; margin-top: 0; font-size: 22px; }
        .input-group { margin-bottom: 15px; text-align: left; }
        .input-group label { display: block; font-size: 13px; color: #747A86; margin-bottom: 5px; font-weight: bold; }
        .input-group input { width: 100%; box-sizing: border-box; padding: 12px; border: 1px solid #E3E5EC; border-radius: 8px; font-size: 15px; }
        .input-group input:focus { border-color: #1D3FE0; outline: none; }
        .error-text { color: #D92D20; font-size: 12px; margin-top: 5px; display: none; }
        .btn-primary { width: 100%; padding: 12px; background: #1D3FE0; color: white; border: none; border-radius: 8px; font-weight: bold; font-size: 15px; cursor: pointer; margin-top: 10px; }
        .google-btn { width: 100%; padding: 10px; background: white; color: #22252B; border: 1px solid #E3E5EC; border-radius: 8px; font-weight: bold; cursor: pointer; display: flex; justify-content: center; align-items: center; gap: 10px; margin-top: 15px; }
        .google-btn img { width: 20px; }
        .auth-links { display: flex; justify-content: space-between; margin-top: 15px; font-size: 13px; }
        .auth-links a { color: #1D3FE0; text-decoration: none; cursor: pointer; }
        .divider { text-align: center; margin: 15px 0; color: #747A86; font-size: 12px; position: relative; }
        .divider::before { content: ""; position: absolute; top: 50%; left: 0; width: 40%; height: 1px; background: #E3E5EC; }
        .divider::after { content: ""; position: absolute; top: 50%; right: 0; width: 40%; height: 1px; background: #E3E5EC; }
    </style>
</head>
<body>

    <div class="header">
        <div class="header-logo">SHOPACC.COM</div>
        <div class="header-user" id="user-info">Chưa đăng nhập</div>
    </div>

    <div class="content">
        <button class="btn-deposit" id="btn-deposit" onclick="deposit(100000)" style="display:none;">Nạp Demo +100K</button>
        <div class="grid" id="product-list"></div>
    </div>

    <div class="modal" id="auth-modal">
        <div class="modal-content">
            <h3 id="auth-title">Đăng Nhập</h3>
            
            <div id="view-login">
                <div class="input-group">
                    <label>Tài khoản</label>
                    <input type="text" id="login-user" placeholder="Nhập tài khoản...">
                </div>
                <div class="input-group">
                    <label>Mật khẩu</label>
                    <input type="password" id="login-pass" placeholder="Nhập mật khẩu...">
                </div>
                <div class="error-text" id="login-error">Tài khoản hoặc mật khẩu không đúng!</div>
                
                <button class="btn-primary" onclick="handleLogin()">Đăng Nhập</button>
                
                <div class="divider">Hoặc</div>
                <button class="google-btn" onclick="alert('Tính năng Google Login đang được phát triển!')">
                    <img src="https://upload.wikimedia.org/wikipedia/commons/5/53/Google_%22G%22_Logo.svg"> Đăng nhập bằng Google
                </button>
                
                <div class="auth-links">
                    <a onclick="switchView('register')">Tạo tài khoản mới</a>
                    <a onclick="switchView('forgot')">Quên mật khẩu?</a>
                </div>
            </div>

            <div id="view-register" style="display:none;">
                <div class="input-group">
                    <label>Tài khoản</label>
                    <input type="text" id="reg-user" placeholder="Viết liền không dấu...">
                </div>
                <div class="input-group">
                    <label>Email</label>
                    <input type="email" id="reg-email" placeholder="Nhập địa chỉ Gmail...">
                </div>
                <div class="input-group">
                    <label>Mật khẩu</label>
                    <input type="password" id="reg-pass" placeholder="Tối thiểu 6 ký tự...">
                </div>
                <div class="error-text" id="reg-error">Tài khoản đã tồn tại!</div>
                
                <button class="btn-primary" onclick="handleRegister()">Đăng Ký</button>
                
                <div class="auth-links" style="justify-content: center;">
                    <a onclick="switchView('login')">Đã có tài khoản? Đăng nhập</a>
                </div>
            </div>

            <div id="view-forgot" style="display:none;">
                <p style="font-size: 13px; color: #747A86; text-align: center; margin-bottom: 15px;">Nhập email để nhận link đặt lại mật khẩu.</p>
                <div class="input-group">
                    <label>Email</label>
                    <input type="email" id="forgot-email" placeholder="Nhập địa chỉ Gmail của bạn...">
                </div>
                <button class="btn-primary" onclick="alert('Hệ thống chưa cấu hình gửi Email, tính năng demo!'); switchView('login');">Gửi Yêu Cầu</button>
                
                <div class="auth-links" style="justify-content: center;">
                    <a onclick="switchView('login')">Quay lại Đăng nhập</a>
                </div>
            </div>
            
            <div style="text-align: center; margin-top: 20px;">
                <a onclick="closeModal()" style="color: #747A86; text-decoration: none; font-size: 13px;">Đóng</a>
            </div>
        </div>
    </div>

    <div class="bottom-nav">
        <div class="nav-item active">Trang chủ</div>
        <div class="nav-item">Danh mục</div>
        <div class="nav-item">Nạp tiền</div>
        <div class="nav-item">Mua nick</div>
        <div class="nav-item" onclick="showAccount()">Tài khoản</div>
    </div>

    <script>
        let token = localStorage.getItem('token');

        function loadProducts() {
            fetch('/api/products')
                .then(res => res.json())
                .then(data => {
                    const list = document.getElementById('product-list');
                    list.innerHTML = '';
                    data.products.forEach(p => {
                        const isSold = p.status === 'SOLD';
                        list.innerHTML += `
                            <div class="card">
                                <div class="card-img">Ảnh Acc (Demo)</div>
                                <div class="card-body">
                                    <div class="card-title">${p.title}</div>
                                    <div class="card-price">${p.price.toLocaleString('vi-VN')} VNĐ</div>
                                    <button class="btn-buy" onclick="buy(${p.id})" ${isSold ? 'disabled' : ''}>
                                        ${isSold ? 'ĐÃ BÁN' : 'Mua Ngay'}
                                    </button>
                                </div>
                            </div>
                        `;
                    });
                });
        }

        function loadUser() {
            if (!token) return;
            fetch('/api/me', { headers: { 'Authorization': 'Bearer ' + token } })
                .then(res => res.json())
                .then(data => {
                    if (data.user) {
                        document.getElementById('user-info').innerText = `${data.user.username} | ${data.user.balance.toLocaleString('vi-VN')}đ`;
                        document.getElementById('btn-deposit').style.display = 'block';
                    }
                });
        }

        function handleLogin() {
            const u = document.getElementById('login-user').value;
            const p = document.getElementById('login-pass').value;
            const errDiv = document.getElementById('login-error');
            errDiv.style.display = 'none';

            fetch('/api/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ username: u, password: p })
            })
            .then(res => res.json())
            .then(data => {
                if (data.error) {
                    errDiv.innerText = data.error;
                    errDiv.style.display = 'block';
                } else {
                    localStorage.setItem('token', data.token);
                    token = data.token;
                    closeModal();
                    loadUser();
                }
            });
        }

        function handleRegister() {
            const u = document.getElementById('reg-user').value;
            const e = document.getElementById('reg-email').value;
            const p = document.getElementById('reg-pass').value;
            const errDiv = document.getElementById('reg-error');
            errDiv.style.display = 'none';

            if(!u || !p || !e) { errDiv.innerText = "Vui lòng nhập đủ thông tin!"; errDiv.style.display = 'block'; return; }

            fetch('/api/register', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ username: u, password: p, email: e })
            })
            .then(res => res.json())
            .then(data => {
                if (data.error) {
                    errDiv.innerText = data.error;
                    errDiv.style.display = 'block';
                } else {
                    alert("Đăng ký thành công!");
                    switchView('login');
                }
            });
        }

        function switchView(view) {
            document.getElementById('view-login').style.display = 'none';
            document.getElementById('view-register').style.display = 'none';
            document.getElementById('view-forgot').style.display = 'none';
            
            if(view === 'login') {
                document.getElementById('auth-title').innerText = "Đăng Nhập";
                document.getElementById('view-login').style.display = 'block';
            } else if (view === 'register') {
                document.getElementById('auth-title').innerText = "Đăng Ký";
                document.getElementById('view-register').style.display = 'block';
            } else if (view === 'forgot') {
                document.getElementById('auth-title').innerText = "Quên Mật Khẩu";
                document.getElementById('view-forgot').style.display = 'block';
            }
        }

        function showAccount() {
            if (token) {
                if(confirm("Bạn có muốn đăng xuất không?")) {
                    localStorage.removeItem('token');
                    location.reload();
                }
            } else {
                switchView('login');
                document.getElementById('auth-modal').style.display = 'flex';
            }
        }

        function closeModal() {
            document.getElementById('auth-modal').style.display = 'none';
        }

        function buy(id) {
            if (!token) return alert("Vui lòng đăng nhập để mua!");
            
            fetch('/api/buy', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + token },
                body: JSON.stringify({ productId: id })
            })
            .then(res => res.json())
            .then(data => {
                if (data.error) alert(data.error);
                else { alert("Mua thành công!"); loadUser(); loadProducts(); }
            });
        }

        function deposit(amount) {
            if (!token) return alert("Vui lòng đăng nhập!");
            fetch('/api/deposit', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + token },
                body: JSON.stringify({ amount: amount })
            }).then(() => loadUser());
        }

        loadProducts();
        loadUser();
    </script>
</body>
</html>
